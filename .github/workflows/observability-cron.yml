name: Creator Radar Observability Cron

on:
  schedule:
    # Measurement: hourly at :15 UTC
    - cron: "15 * * * *"
    # Discovery: every 6 hours (primary — Vercel Hobby cannot run sub-daily crons)
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run (avoid 'both' unless intentional)"
        required: true
        default: "measurement"
        type: choice
        options:
          - measurement
          - discovery
          - both

concurrency:
  group: observability-cron-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: UTC

jobs:
  measurement:
    if: |
      github.event.schedule == '15 * * * *' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'measurement' || github.event.inputs.job == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: touch .env.local
      - name: Run measurement
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npm run cron:measurement

  discovery:
    if: |
      github.event.schedule == '0 */6 * * *' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'discovery' || github.event.inputs.job == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: touch .env.local
      - name: Run discovery (primary 6h schedule)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npm run cron:discovery
