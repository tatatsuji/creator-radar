name: Creator Radar Observability Cron

on:
  schedule:
    # Measurement: hourly at :15 UTC (dev Supabase only)
    - cron: "15 * * * *"
  workflow_dispatch:

concurrency:
  group: observability-cron
  cancel-in-progress: false

jobs:
  measurement:
    if: github.event.schedule == '15 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Run measurement against dev Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npm run cron:measurement

  # Discovery cron is disabled here — Vercel Cron (vercel.json, every 6h) is the production primary.
  # Use workflow_dispatch + npm run cron:discovery locally for dev/fallback only.
